name: Kalvium Daily Report

on:
  schedule:
    - cron: '30 10 * * 1-5'   # Mon–Fri at 4:00 PM IST (10:30 AM UTC)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
  
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install
      - run: npx playwright install chromium

      - name: Run automation
        run: npm start
        env:
          AUTH_STATE: ${{ secrets.AUTH_STATE }}

      - name: Upload error screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshot
          path: error-screenshot.png
          retention-days: 7

      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          # EMAIL_USERNAME must be the Gmail address for the account where the App Password was created.
          username: ${{ secrets.EMAIL_USERNAME }}
          # EMAIL_PASSWORD must be a Gmail App Password (Google Account -> Security -> App Passwords), not a regular password.
          password: ${{ secrets.EMAIL_PASSWORD }}
          # Troubleshooting when updating Gmail credentials:
          # - Ensure 2-Step Verification (2FA) is enabled on the Gmail account.
          # - Generate/re-generate an App Password and save it in EMAIL_PASSWORD.
          # - Keep EMAIL_USERNAME and EMAIL_PASSWORD from the same Gmail account.
          # - Do not use regular Gmail passwords; SMTP auth can fail or time out.
          subject: ❌ Kalvium Daily Report FAILED
          to: ${{ secrets.EMAIL_TO }}
          from: Kalvium Automation <${{ secrets.EMAIL_USERNAME }}>
          body: |
            ❌ Kalvium daily automation failed.
            Repo: ${{ github.repository }}
            Workflow: ${{ github.workflow }}
            Branch: ${{ github.ref_name }}
            Run link:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

